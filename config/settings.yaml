# 全局配置

# 数据存储根目录 - 项目根目录下的 data/ 文件夹
data_root: "./data"

# 保留的版本数量（按设备独立保留）
max_versions: 10

# 日志缓冲大小（字节）
log_buffer_size: 65536

# 收集配置
collection:
  # 并行收集最大线程数（控制同时对几台设备 SSH）
  max_parallel: 4

# SSH 超时设置（秒）
ssh_timeout:
  connect: 20
  read: 20
  write: 20

# 分析配置
analysis:
  # 是否启用配置验证
  enable_config_validation: true

  # 是否启用性能分析
  enable_performance_analysis: true

  # 是否启用变更检测
  enable_change_detection: true

  # 变更检测对比周期（周数）
  change_detection_lookback: 4

# LLM 配置（用于日志 AI 分析）
llm:
  timeout: 30
  providers:
    - name: "DeepSeek"
      base_url: "https://api.deepseek.com/v1"
      api_key: ""
      model: "deepseek-chat"
    - name: "Qwen"
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      api_key: ""
      model: "qwen-turbo"
