# NDM 配置审计 —— 例外登记表
#
# 例外 = 「标准适用，但这里的偏离被接受」。与另两种机制的分工：
#   · 标准对本组织某类设备**根本不适用** → 改标准（规则的 exempt_sites / enabled: false），走 git 评审
#   · 标准适用、但**这里的偏离暂时被接受** → 登记例外（本文件），必有到期日，到期复核
#
# 字段：
#   id                    exc-NNN，页面新建时自动取号
#   rule_id               必须存在于规则库（loader 会校验，防拼写错误导致豁免静默失效）
#   scope                 device（设备名）/ site（站点码）/ all（全网，仅用于"暂时都做不到、限期重审"）
#   reason                为什么接受这个偏离（必填）
#   compensating_control  补偿控制（选填）—— 例：已用 ACL 限制管理网段访问
#   approved_by           批准人（必填）
#   approved_at           批准日期 YYYY-MM-DD（必填）
#   expires_at            到期日 YYYY-MM-DD（必填，且晚于 approved_at）——**不允许永久例外**
#   revoked               撤销块（选填）：{at, by, reason}。撤销 = 软删除，条目保留供历史审计追溯
#
# 状态一律**推导**，不存字段：
#   有 revoked          → 已撤销（不参与豁免匹配）
#   expires_at < 今天    → 已过期（不豁免，但审计报告标注「例外已过期」）
#   30 天内到期          → 即将到期（仍豁免）
#   否则                → 生效中
#
# 本文件**不参与 ruleset_hash**（趋势里「标准变没变」与「豁免变没变」分开判断），
# 有独立的 exceptions_hash 随审计结果入库。由页面编辑时走"备份 → 原子替换 → 校验失败回滚"。

exceptions: []
