# NDM 配置审计 —— 组织惯例层（我们自己的使用习惯）
#
# 来源：Qorvo 网络团队既有做法与历史规划（命名规范、VLAN 规划、SVI 网段规律等）。
# 与另两层的区别：这层不是厂商要求、也不是总部下发，而是「我们一直这么做」。
# severity 一律 convention —— 报告里据此可与总部强制项（shall）区分开。
#
# 作用域数据（站点表 / 命名规范 / VLAN 规范）在 _scopes.yaml，本文件不放。

rules:

  # ==== 命名 ====
  - id: naming_device_format
    title: 设备名符合命名规范
    check: device_name_format
    platforms: [all]
    level: 风险提示
    source: 组织规范
    severity: convention
    fix: '# 按 站点码+机房/层级+类型+编号 重命名（改设备名会影响网管与日志归属，需评估）'
    why: 设备名是排障与网管识别设备的唯一依据；格式不符容易导致连错设备。

  - id: naming_hostname_match
    title: 配置内 hostname 与设备名一致
    check: hostname_match
    platforms: [all]
    level: 风险提示
    source: 组织规范
    severity: convention
    fix: 'hostname <设备名>'
    why: 不一致或重名会让日志与网管无法区分设备，排障时容易连错机器。
    note: 执行会中断现有管理会话，需安排窗口。

  # ==== VLAN ====
  - id: vlan_name_pure_purpose
    title: VLAN 名称使用纯用途名
    check: vlan_name_pure
    platforms: [all]
    level: 改进建议
    source: 组织规范
    severity: convention
    fix: |
      vlan <id>
          name <纯用途名>
    why: 用户已确定名称用纯用途名，不含网段、不含站点；名称里写网段是手工规划遗留。

  - id: vlan_id_not_in_standard
    title: 使用了标准以外的 VLAN ID
    check: vlan_id_standard
    platforms: [all]
    level: 改进建议
    source: 组织规范
    severity: convention
    fix: '# 把业务迁移到标准 VLAN，再删除非标 VLAN（涉及端口重划与地址变更，需单独排期）'
    why: 非标 VLAN 会让 VLAN 规划失去唯一性，新同事无法凭编号判断用途。

  - id: vlan_address_third_octet
    title: SVI 地址第三段等于 VLAN ID
    check: addr_third_octet
    platforms: [all]
    level: 改进建议
    source: 组织规范
    severity: convention
    exempt_sites: [exempt_vlan_address]
    fix: |
      interface vlan <id>
      ip address 10.xx.<id>.x/24
    why: 组织标准规定网段第三段等于 VLAN ID；不适用 OSAT 站点与 BJD。

  - id: vlan1_in_use
    title: VLAN 1 是否真正在使用
    check: vlan1_in_use
    platforms: [all]
    level: 改进建议
    source: 组织规范
    severity: convention
    fix: |
      no interface vlan 1
      interface <端口>
          vlan access <标准VLAN>
    why: 标准注明 VLAN 1 应尽量避免。判定不看「配置里是否出现 vlan 1」（默认就有），只看有无 SVI 或端口在用。

  # ==== 登录与应急访问 ====
  - id: cx_banner_motd
    title: 已配 banner motd
    check: present_regex
    params: {pattern: '(?mi)^banner motd'}
    platforms: [cx]
    level: 改进建议
    source: 组织规范
    severity: convention
    fix: 'banner motd ^ <登录告警文本> ^'
    why: 登录前通告是追责前提。

  # ==== 运维就绪度 ====
  - id: ops_config_not_saved
    title: 有配置改动尚未保存（运行配置与启动配置不一致）
    check: config_drift
    platforms: [all]
    level: 强烈建议
    source: 组织规范
    severity: convention
    fix: |
      write memory
    why: >-
      运行配置与启动配置不一致，说明有改动没保存 —— 设备一旦重启，这些改动会全部丢失。
      现网实测到一例：C9500 的 SVL 链路配置在 running 里、不在 startup 里；
      设备自报时间戳也印证了（配置 6/30 变更、NVRAM 6/25 保存）。
    note: >-
      比对前已剥离两边本来就不同的内容：头部元信息、命令行回显、证书块
      （running 是 hex 正文、startup 只有 nvram 路径）、ntp clock-period、
      空行/分隔行/行尾空格。不剥离的话这条检查会 100% 误报。
      采集后也会产生同类告警（config_drift），保存并重新采集后自动消除。

  # 与其他规则相反：**缺此项才提示**（公司标准要求保留 allow-fail-through）
  - id: cx_allow_fail_through_present
    title: 已配 allow-fail-through（公司标准，要求保留）
    check: present_regex
    params: {pattern: '(?mi)aaa authentication allow-fail-through'}
    platforms: [cx]
    level: 改进建议
    source: 组织规范
    severity: convention
    fix: 'aaa authentication allow-fail-through'
    why: 用户说明「这是为了确保紧急时刻管理员可以本地登录进设备」，属公司标准。
    note: 与其他规则相反——**缺此项才提示**。

  # ==== 生命周期（EoL / 保修）====
  # 数据来源：eol_models / device_lifecycle 两张表。Cisco 可配 API 凭据自动刷新
  # （EoX，按型号或序列号），Aruba 无公开 API 只能手工登记；保修期一律手工
  # （Cisco SN2INFO 仅对 SNTC 客户开放、HPE 无 API）。详见
  # docs/superpowers/plans/2026-09-20-device-lifecycle.md。

  - id: ops_eol_announced
    title: 型号已公布停止销售 / 停止支持
    check: eol_announced
    platforms: [all]
    level: 风险提示
    source: 组织规范
    severity: convention
    fix: '# 规划替换：查厂商迁移建议，在停止支持日期（LastDateOfSupport）之前完成替换'
    why: >-
      停止支持之后不再有安全补丁与硬件更换渠道 —— 这是**时效风险**，不是配置错误。
      现网那台 C9500 正属此类：设备越旧，故障后拿不到同型号替代的时间越长。
    note: 数据显示的是厂商公告日期，不代表设备当前状态；换型决策要结合预算与实际负载。

  - id: ops_warranty_expired
    title: 保修已过期或临近到期
    check: warranty_expired
    params: {warn_days: 90}
    platforms: [all]
    level: 风险提示
    source: 组织规范
    severity: convention
    fix: '# 评估续保（或列入更换计划）；过保设备故障后需按 T&M 付费维修'
    why: 保修到期后硬件故障的维修与备件要走付费流程，修复时间也会变长。
    note: >-
      注意区分「保修（hardware warranty）」与「服务合同（Smart Net 等）」：
      这里登记的是保修到期日，合同到期日请在备注里写明（两者口径不同）。

  - id: ops_lifecycle_unknown
    title: 生命周期信息待查（型号 EoL 与保修期）
    check: lifecycle_unknown
    params: {stale_days: 365, collective_threshold: 3}
    collective: true        # 命中多台时折叠成一条网络级条目（阈值见 collective_threshold）
    platforms: [all]
    level: 需人工判断
    source: 组织规范
    severity: convention
    fix: '# 在设备详情页「生命周期」登记型号 EoL 与各序列号保修到期日（支持批量粘贴导入）'
    why: >-
      没有登记就没有判断依据 —— 与其静默通过，不如明确标成"待查"去核实。
      信息登记超过 stale_days 天未复核的，同样回到"待查"（两年前抄来的日期不能一直冒充已确认）。
    note: 命中设备数达到阈值时折叠为一条（避免几十条"待查"淹掉真问题）。
